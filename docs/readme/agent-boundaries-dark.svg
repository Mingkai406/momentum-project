<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Read with scope. Write with approval.</title><desc id="desc">The Express API authorizes a goal snapshot for the Python ADK agent. The agent returns a draft for mentor review. Only a confirmed request passes permission, revision and replay checks before saving to PostgreSQL. Vertex AI is optional and live validation is pending.</desc>
