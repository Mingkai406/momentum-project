<g stroke="#9eacc1" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M365 236H429"/><path d="M769 236H833"/><path d="M365 390H429"/><path d="M769 390H833"/></g>
<g font-size="23" font-weight="700" fill="#e6edf3"><text x="60" y="228">Authorized snapshot</text><text x="464" y="228">Google ADK agent</text><text x="868" y="228">Reviewable draft</text><text x="60" y="382">Mentor confirmation</text><text x="464" y="382">API rechecks</text><text x="868" y="382">Feedback saved</text></g>
<g font-size="18" fill="#a6b3c5"><text x="60" y="257">Express / accepted relationship</text><text x="464" y="257">Python / read-only tools</text><text x="868" y="257">Sources / editable feedback</text><text x="60" y="411">Next.js / exact reviewed text</text><text x="464" y="411">Access / revision / replay</text><text x="868" y="411">PostgreSQL / atomic write</text></g>
